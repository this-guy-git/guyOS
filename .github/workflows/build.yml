name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm python3 dosfstools mtools qemu-system-x86 syslinux isolinux genisoimage

      - name: Build disk image
        env:
          CC: gcc
          LD: ld
          OBJCOPY: objcopy
          PYTHON: python3
        run: |
          make clean
          make
